# git-cliff configuration: CHANGELOG.md is generated from the commit history
# (Conventional Commits) in the Keep a Changelog format.
#
#   git cliff --tag v0.1.0 -o CHANGELOG.md     # before tagging a release
#   git cliff --latest --strip header          # release notes (used by the release workflow)

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/amiadesu/sipl-toolkit/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/amiadesu/sipl-toolkit/releases/tag/{{ release.version }}
{% endif -%}
{% elif release.previous.version -%}
[unreleased]: https://github.com/amiadesu/sipl-toolkit/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor -%}
"""
trim = false

[git]
conventional_commits = true
# Commits not in the `type(scope): message` form are left out.
filter_unconventional = true
# The HTML comments only order the groups; they are not shown.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^(perf|refactor)", group = "<!-- 2 -->Changed" },
    { message = "^revert", group = "<!-- 3 -->Removed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    # Internal changes that do not affect users of the toolkit.
    { message = "^(chore|ci|build|test|style)", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"